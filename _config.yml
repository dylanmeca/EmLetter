title: EmLetter
description: "Editor de cartas para escribir, diseñar y compartir mensajes con estilo."
lang: es
locale: es_PE
url: "https://emletter.vercel.app"
baseurl: ""
logo: "/assets/favicon.svg"
author:
  name: Dylan Meca

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

webmaster_verifications:
  google: "lBg4RSX2hnEcxA7fWW46cux1hJYk1zvuvF55FjpzZYk"
  bing: ""

google_analytics:
  enabled: true
  measurement_id: "G-QGPGVLNF8G"

# Google AdSense: anuncios manuales y opcionales.
# Sin activar AdSense ni configurar IDs reales, no se cargan anuncios.
# Consulta ADSENSE.md antes de activarlo; mantener Auto ads desactivados
# evita inserciones automáticas en herramientas o en el chat privado.
google_adsense:
  enabled: false
  client: "ca-pub-0000000000000000" # Reemplazar por el Publisher ID real
  slots:
    landing_bottom: ""   # index.html: después de las funcionalidades
    editor_bottom: ""    # home.html: después del espacio de edición
    tutorial_middle: "" # tutorial.html: entre apartados
    pdf_bottom: ""      # lectorpdf.html: bajo el visor (evaluar políticas)
    editor_top: ""      # Compatibilidad: se usa si editor_bottom está vacío
    reader_bottom: ""   # Antiguo: no se muestra en cartas privadas

exclude:
  - README.md
  - ADSENSE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - src
  - scripts
  - vendor
  - emletter.gemspec
