title: EmLetter
description: "Editor de cartas para escribir, diseñar y compartir mensajes con estilo."
lang: es
locale: es_PE
url: "https://emletter.vercel.app"
baseurl: ""
logo: "/assets/favicon.svg"
author:
  name: Dylan Meca

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

webmaster_verifications:
  google: "lBg4RSX2hnEcxA7fWW46cux1hJYk1zvuvF55FjpzZYk"
  bing: ""

google_analytics:
  enabled: true
  measurement_id: "G-QGPGVLNF8G"

# Google AdSense
# 1) Cambia enabled a true.
# 2) Indica tu Publisher ID (ca-pub-...).
# 3) Crea unidades de anuncio adaptables en AdSense y pega sus IDs de slot.
# Los bloques quedan ocultos automáticamente cuando el slot está vacío.
google_adsense:
  enabled: false
  client: "ca-pub-0000000000000000"
  slots:
    editor_top: ""
    reader_bottom: ""

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - src
  - scripts
  - vendor
  - emletter.gemspec
