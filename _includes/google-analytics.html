{% if site.google_analytics.enabled and site.google_analytics.measurement_id and site.google_analytics.measurement_id != '' %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics.measurement_id | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics.measurement_id | escape }}');
</script>
{% endif %}
