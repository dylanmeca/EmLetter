<!doctype html>
<html lang="{{ site.lang | default: 'es' | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00061A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EmLetter">
  <meta name="emletter-baseurl" content="{{ site.baseurl | default: '' | escape }}">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Almendra+SC&family=Astloch&family=Eagle+Lake&family=Fondamento&family=Germania+One&family=Grenze&family=Grenze+Gotisch&family=MedievalSharp&family=Metal+Mania&family=New+Rocker&family=Pirata+One&family=UnifrakturCook:wght@700&family=UnifrakturMaguntia&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Butcherman&family=Creepster&family=Eater&family=Frijole&family=Jolly+Lodger&family=Lacquer&family=Mystery+Quest&family=Nosifer&family=Rubik+Beastly&family=Rubik+Dirt&family=Rubik+Distressed&family=Rubik+Glitch&family=Rubik+Wet+Paint&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caudex&family=Cinzel&family=Cinzel+Decorative&family=Cormorant+Garamond&family=EB+Garamond&family=IM+Fell+DW+Pica&family=IM+Fell+DW+Pica+SC&family=IM+Fell+Double+Pica&family=IM+Fell+Double+Pica+SC&family=IM+Fell+English&family=IM+Fell+English+SC&family=IM+Fell+French+Canon&family=IM+Fell+French+Canon+SC&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat&family=Covered+By+Your+Grace&family=Gloria+Hallelujah&family=Homemade+Apple&family=La+Belle+Aurore&family=Nothing+You+Could+Do&family=Permanent+Marker&family=Reenie+Beanie&family=Rock+Salt&family=Sedgwick+Ave+Display&family=Shadows+Into+Light&family=Special+Elite&family=Zeyada&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  {{ content }}
  <noscript><p class="noscript">Activa JavaScript para escribir y abrir cartas.</p></noscript>
  {% if page.layout == 'carta' %}
  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/export-image.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/pwa.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/mobile-app.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
