<!doctype html>
<html lang="{{ site.lang | default: 'es' | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00061A">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  {{ content }}
  <noscript><p class="noscript">Activa JavaScript para escribir y abrir cartas.</p></noscript>
  {% if page.layout == 'carta' %}
  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/export-image.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
