{% assign ad_slot = include.slot | default: '' %}
{% if site.google_adsense.enabled and site.google_adsense.client and site.google_adsense.client != '' and ad_slot != '' %}
<div class="ad-placement {{ include.class | default: '' }}" aria-label="Publicidad">
  <span class="ad-label">Publicidad</span>
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ site.google_adsense.client | escape }}"
       data-ad-slot="{{ ad_slot | escape }}"
       data-ad-format="{{ include.format | default: 'auto' | escape }}"
       data-full-width-responsive="true"></ins>
</div>
<script>
  (window.adsbygoogle = window.adsbygoogle || []).push({});
</script>
{% endif %}
